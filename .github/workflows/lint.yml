name: Lint JavaScript

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    lint:
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - name: Checkout repository
              uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225 # v1.2.0
              with:
                  fetch-depth: 0

            - name: Add build cache
              # v4
              uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Setup Node
              # v4
              uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
              with:
                  node-version-file: '.nvmrc'

            - name: Install node packages
              uses: nick-fields/retry@7c68161adf97a48beb850a595b8784ec57a98cbb
              with:
                  timeout_minutes: 10
                  max_attempts: 5
                  command: npm ci

            - name: Check formatting with Oxfmt
              run: npm run format:check

            - name: Lint with Oxlint
              run: npm run lint

            - name: Lint for Firefox
              run: npm run lint:firefox
